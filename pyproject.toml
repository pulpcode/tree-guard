[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treeguard"
version = "0.1.0"
description = "Constrained semantic governance for versioned information trees"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
treeguard = "treeguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
